<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>ACGC</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #ddd;
            font-family: system-ui, sans-serif;
            height: 100%;
            overflow: hidden;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }
        #canvas {
            display: block;
            background: #000;
            outline: none;
            image-rendering: pixelated;
            width: 100vw;
            height: 100vh;
        }
        #status {
            position: fixed;
            top: 8px;
            left: 8px;
            font-size: 12px;
            opacity: 0.7;
            pointer-events: none;
        }
        #progress {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #4a9;
            width: 0%;
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
    <div id="status">loading…</div>
    <div id="progress"></div>

    <script type="text/javascript">
        var statusEl = document.getElementById('status');
        var progressEl = document.getElementById('progress');

        // Match the canvas's drawing-buffer size to the viewport (in device
        // pixels) so rendering is crisp at any window size. Called on init
        // and on every resize; SDL2's Emscripten port picks up the new size
        // via its own resize listener and dispatches an SDL_WINDOWEVENT_RESIZED.
        function resizeCanvasToViewport() {
            var c = document.getElementById('canvas');
            var dpr = window.devicePixelRatio || 1;
            c.width  = Math.floor(window.innerWidth  * dpr);
            c.height = Math.floor(window.innerHeight * dpr);
        }
        resizeCanvasToViewport();
        window.addEventListener('resize', resizeCanvasToViewport);

        var Module = {
            canvas: (function() {
                var c = document.getElementById('canvas');
                c.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload.');
                    e.preventDefault();
                }, false);
                return c;
            })(),
            setStatus: function(text) {
                if (!text) {
                    statusEl.style.display = 'none';
                    progressEl.style.width = '0%';
                    return;
                }
                statusEl.textContent = text;
                var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    var pct = parseFloat(m[1]) / parseFloat(m[3]) * 100;
                    progressEl.style.width = pct + '%';
                } else {
                    progressEl.style.width = '100%';
                }
            },
            print: function(text) { console.log(text); },
            printErr: function(text) { console.warn(text); },
            onRuntimeInitialized: function() {
                Module.setStatus('');
                document.getElementById('canvas').focus();
            }
        };

        window.onerror = function(msg) {
            Module.setStatus('error — check console');
            console.error(msg);
        };

        // Register the service worker on page load so the wasm bundle is
        // cached for offline use after the first visit. Requires HTTPS (or
        // localhost). Failure is non-fatal — the app still works online.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').catch(function(err) {
                    console.warn('[pwa] service worker registration failed:', err);
                });
            });
        }
        // Ask the browser not to evict our IndexedDB (saves + future ROM
        // storage) under storage pressure. Best-effort; users can still
        // decline. No-op on browsers that don't support it.
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(function() { /* ignore */ });
        }
    </script>
    {{{ SCRIPT }}}
</body>
</html>
